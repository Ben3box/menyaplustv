name: Mise à jour des vidéos YouTube
on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes
  workflow_dispatch:          # permet aussi de le lancer à la main
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-youtube.js
      - name: Enregistrer si de nouvelles vidéos
        run: |
          git config user.name "menyaplustv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add videos.json
          git diff --staged --quiet || (git commit -m "Nouvelles vidéos YouTube" && git push)
